# Starts Qdrant locally. Run:  docker compose up -d
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API + web dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC (faster; the python client uses it when available)
    volumes:
      - ./qdrant_storage:/qdrant/storage
